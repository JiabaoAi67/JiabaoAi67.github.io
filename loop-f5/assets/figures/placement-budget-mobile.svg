<svg xmlns="http://www.w3.org/2000/svg" width="550" height="1590" viewBox="0 0 550 1590" role="img" aria-labelledby="title desc">
<title id="title">Placement matters most at four sampling steps</title>
<desc id="desc">Word error rate for Prefix, Middle, and Suffix, each with 108.4 million parameters. At 32 sampling steps their means lie between 2.04 and 2.36 percent on Seed-TTS and between 2.07 and 2.24 percent on LibriSpeech-PC. At four steps the Suffix-minus-Prefix gap is 3.44 and 5.97 percentage points, respectively. Middle has the lowest mean at 32 steps on both datasets and at four steps on LibriSpeech-PC. The 32-step panels use a zero-to-three-percent axis; four-step panels use zero-to-twenty percent.</desc>
