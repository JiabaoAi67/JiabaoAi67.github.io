<svg xmlns="http://www.w3.org/2000/svg" width="550" height="2130" viewBox="0 0 550 2130" role="img" aria-labelledby="title desc">
<title id="title">WER (%) ↓: all six models at 32 and four sampling steps</title>
<desc id="desc">Word error rate for all six models: Baseline, Loop 9 by 2, Loop 6 by 3, Prefix, Middle, and Suffix. All six execute 18 block calls per network evaluation; Prefix, Middle, and Suffix each have 108.4 million parameters. At 32 sampling steps all six means lie between 2.04 and 2.96 percent on Seed-TTS and between 2.07 and 2.65 percent on LibriSpeech-PC. At four steps the Suffix-minus-Prefix gap is 3.44 and 5.97 percentage points, respectively. Middle has the lowest mean at 32 steps on both datasets and at four steps on LibriSpeech-PC. The 32-step panels use a zero-to-three-percent axis; four-step panels use zero-to-twenty percent. Lower WER is better.</desc>
<style>text {font-family: Arial, Helvetica, sans-serif; font-variant-numeric: tabular-nums;}</style>
