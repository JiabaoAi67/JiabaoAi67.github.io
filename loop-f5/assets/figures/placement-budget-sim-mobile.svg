<svg xmlns="http://www.w3.org/2000/svg" width="550" height="2350" viewBox="0 0 550 2350" role="img" aria-labelledby="title desc">
<title id="title">SIM-o ↑: all seven models at 32 and four sampling steps</title>
<desc id="desc">SIM-o ↑ for Baseline, CYCLE 9×2, SEQUENCE 9×2, Loop 6×3, Prefix, Middle and Suffix on both datasets at 32 and 4 steps. All models execute 18 block calls; partial loops have 108.4M parameters. Means use four inference seeds on Seed-TTS and three on LibriSpeech-PC.</desc>
