<svg xmlns="http://www.w3.org/2000/svg" width="550" height="2130" viewBox="0 0 550 2130" role="img" aria-labelledby="title desc">
<title id="title">SIM-o ↑: all six models at 32 and four sampling steps</title>
<desc id="desc">Speaker similarity, SIM-o, for all six models: Baseline, Loop 9 by 2, Loop 6 by 3, Prefix, Middle, and Suffix, at 32 and four sampling steps on Seed-TTS and LibriSpeech-PC. Higher is better. All panels use a zero-to-0.65 axis. Among Prefix, Middle, and Suffix, Suffix has the highest 32-step mean on both datasets. All six execute 18 block calls per evaluation; Prefix, Middle, and Suffix have 108.4 million parameters each.</desc>
<style>text {font-family: Arial, Helvetica, sans-serif; font-variant-numeric: tabular-nums;}</style>
