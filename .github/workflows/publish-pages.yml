name: Publish Pages (manual diagnostic)

# A bounded diagnostic for the deploy-pages client's 10-minute timeout.
# It uses the same Pages API and cannot repair a stalled Pages backend.
# REST: https://docs.github.com/en/rest/pages/pages
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # All pages already contain complete HTML. Preserve the full static tree;
      # no Jekyll build or conversion is needed. This action excludes .git/.github.
      - name: Upload the complete static site
        id: artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
          include-hidden-files: true
          retention-days: 1

      - name: Create one Pages deployment
        id: deployment
        timeout-minutes: 2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          # Never enable request logging: the create body contains an OIDC token.
          debug: false
          retries: 0
          base-url: https://api.github.com
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              core.setFailed('The uploaded Pages artifact has no valid ID.');
              return;
            }
            try {
              const oidcToken = await core.getIDToken();
              core.setSecret(oidcToken);
              // Deliberately one POST, with retries disabled. Do not log its body
              // or raw request errors, which can contain the OIDC token.
              const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                ...context.repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: oidcToken,
                headers: { 'X-GitHub-Api-Version': '2026-03-10' },
                request: { signal: AbortSignal.timeout(30000) }
              });
              // The REST API also accepts the build SHA as a deployment ID.
              const deploymentId = String(data.id || context.sha);
              core.setOutput('deployment_id', deploymentId);
              if (data.page_url) {
                const pageUrl = new URL(data.page_url.includes('://') ? data.page_url : `https://${data.page_url}`);
                if (pageUrl.protocol === 'https:') core.setOutput('page_url', pageUrl.href);
              }
              core.info(`Created Pages deployment ${deploymentId}.`);
            } catch (error) {
              const status = Number.isInteger(error.status) ? `HTTP ${error.status}` : 'request error';
              core.setFailed(`Pages deployment creation failed (${status}); it was not retried. If the response was lost, inspect Pages before starting another run.`);
            }

      - name: Observe Pages for up to 30 minutes
        id: observe
        timeout-minutes: 32
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PAGES_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        with:
          debug: false
          retries: 0
          base-url: https://api.github.com
          script: |
            const deploymentId = process.env.PAGES_DEPLOYMENT_ID;
            if (!deploymentId) {
              core.setFailed('No Pages deployment ID was returned.');
              return;
            }
            const terminalFailures = new Set([
              'deployment_failed', 'deployment_content_failed',
              'deployment_cancelled', 'deployment_lost'
            ]);
            const started = Date.now();
            const deadline = started + 30 * 60 * 1000;
            let lastStatus = 'pending';
            while (Date.now() < deadline) {
              const nextPoll = Date.now() + 30000;
              try {
                const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {
                  ...context.repo,
                  pages_deployment_id: deploymentId,
                  headers: { 'X-GitHub-Api-Version': '2026-03-10' },
                  request: { signal: AbortSignal.timeout(Math.max(1, Math.min(20000, deadline - Date.now()))) }
                });
                lastStatus = typeof data.status === 'string' && /^[a-z_]+$/.test(data.status) ? data.status : 'unknown_status';
                core.info(`Pages: ${lastStatus} (${Math.floor((Date.now() - started) / 1000)}s elapsed).`);
                core.setOutput('status', lastStatus);
                if (lastStatus === 'succeed') return;
                if (terminalFailures.has(lastStatus)) {
                  core.setFailed(`Pages reported terminal status: ${lastStatus}.`);
                  return;
                }
              } catch (error) {
                const status = Number.isInteger(error.status) ? error.status : 0;
                if ([400, 401, 403, 422].includes(status)) {
                  core.setFailed(`Pages status polling failed (HTTP ${status}).`);
                  return;
                }
                core.warning(`Pages status temporarily unavailable (${status ? `HTTP ${status}` : 'request error'}); observation will continue.`);
              }
              const delay = Math.min(nextPoll, deadline) - Date.now();
              if (delay > 0) await new Promise(resolve => setTimeout(resolve, delay));
            }
            core.setFailed(`Pages did not succeed within 30 minutes (last status: ${lastStatus}). Cleanup will cancel any unfinished deployment.`);

      - name: Cancel an unfinished deployment after failure or cancellation
        if: ${{ always() && steps.deployment.outputs.deployment_id != '' && (steps.observe.outputs.status != 'succeed' || cancelled()) }}
        timeout-minutes: 2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PAGES_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        with:
          debug: false
          retries: 0
          base-url: https://api.github.com
          script: |
            const parameters = {
              ...context.repo,
              pages_deployment_id: process.env.PAGES_DEPLOYMENT_ID,
              headers: { 'X-GitHub-Api-Version': '2026-03-10' }
            };
            // A deployment can complete between the last poll and cleanup.
            try {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {
                ...parameters,
                request: { signal: AbortSignal.timeout(20000) }
              });
              if (data.status === 'succeed') {
                core.info('Pages has succeeded; no cancellation is needed.');
                return;
              }
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(data.status)) {
                core.info('Pages is already in a terminal state; no unfinished deployment remains.');
                return;
              }
            } catch {
              core.warning('Could not confirm the final status; attempting cancellation.');
            }
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                ...parameters,
                request: { signal: AbortSignal.timeout(30000) }
              });
              core.info('Requested cancellation of the unfinished Pages deployment.');
            } catch (error) {
              const status = Number.isInteger(error.status) ? `HTTP ${error.status}` : 'request error';
              core.setFailed(`Pages cancellation failed (${status}); inspect the deployment before starting another run.`);
            }
